<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Đăng nhập - Hệ Thống Nhà Sách</title>
    <!-- Nhúng Bootstrap & FontAwesome -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Nhúng file CSS riêng của bạn -->
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <!-- Header rút gọn cho trang đăng nhập -->
    <header class="navbar-custom mb-5 shadow-sm">
      <div class="container text-center py-2">
        <a
          class="navbar-brand text-white text-decoration-none fs-3 fw-bold"
          href="/"
        >
          <i class="fas fa-book-open me-2"></i> NHÀ SÁCH
        </a>
      </div>
    </header>

    <div class="container mb-5">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <!-- Khung Form Đăng Nhập -->
          <div class="card book-card border-0 p-3">
            <div class="card-body">
              <h3
                class="text-center fw-bold mb-4"
                style="color: var(--fahasa-red)"
              >
                ĐĂNG NHẬP
              </h3>

              <!-- Hiển thị thông báo lỗi (Nếu nhập sai mật khẩu) -->
              <div th:if="${error}" class="alert alert-danger text-center py-2">
                <i class="fas fa-exclamation-triangle me-1"></i>
                <span th:text="${error}"></span>
              </div>

              <form action="/login" method="post">
                <!-- Ô nhập Username -->
                <div class="input-group mb-3">
                  <span class="input-group-text bg-white border-end-0"
                    ><i class="far fa-user text-muted"></i
                  ></span>
                  <input
                    type="text"
                    class="form-control border-start-0 ps-0"
                    name="username"
                    placeholder="Tên đăng nhập"
                    required
                  />
                </div>

                <!-- Ô nhập Password -->
                <div class="input-group mb-4">
                  <span class="input-group-text bg-white border-end-0"
                    ><i class="fas fa-lock text-muted"></i
                  ></span>
                  <input
                    type="password"
                    class="form-control border-start-0 ps-0"
                    name="password"
                    placeholder="Mật khẩu"
                    required
                  />
                </div>

                <!-- Nút Submit (dùng class btn-add-cart để lấy màu đỏ của Fahasa từ style.css) -->
                <button
                  type="submit"
                  class="btn btn-add-cart w-100 py-2 fs-5 mb-3 shadow-sm"
                >
                  Đăng Nhập
                </button>
              </form>

              <!-- Dòng chuyển hướng Đăng ký -->
              <div class="text-center mt-3 border-top pt-3">
                <span class="text-muted">Bạn chưa có tài khoản?</span>
                <a
                  href="/register"
                  class="text-decoration-none fw-bold"
                  style="color: var(--fahasa-red)"
                  >Đăng ký ngay</a
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
  </body>
</html>
